# Application
spring.application.name=backend

# Active profiles (dev enables seed data on empty DB)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Seed data (creates 3 demo users + sample documents if DB is empty)
app.seed.enabled=${SEED_DATA:true}

# Database (PostgreSQL) - override via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livetext}
spring.datasource.username=${DB_USERNAME:livetext}
spring.datasource.password=${DB_PASSWORD:livetext}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT (HS256). Secret must be at least 32 bytes. Change JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:dev-default-secret-please-change-me-this-string-must-be-at-least-32-bytes-long}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}

# Refresh token cookie
app.cookie.secure=${APP_COOKIE_SECURE:false}

# MinIO object storage (images/assets)
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=${MINIO_BUCKET:livetext-assets}
app.minio.presign-expiry=${MINIO_PRESIGN_EXPIRY:10m}

# Logging
logging.level.com.example.backend=INFO

# File upload limits (images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Redis (pub/sub for cross-instance WebSocket broadcast)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.redis.prefix=livetext