# Test profile: in-memory H2 (no external DB needed for unit tests)
spring.datasource.url=jdbc:h2:mem:livetext-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate (H2 for tests)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests (Hibernate manages schema)
# Disable Flyway in tests (Hibernate manages schema)
spring.flyway.enabled=false

# Disable seed data in tests
spring.profiles.active=

# JWT test config
app.jwt.secret=test-secret-key-test-secret-key-test-secret-key-test-secret-key-test-secret-key
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.cors.allowed-origins=http://localhost:5173
app.cookie.secure=false

# Dummy MinIO config (never contacted in tests — uploads are mocked)
app.minio.endpoint=http://localhost:9000
app.minio.public-endpoint=http://localhost:9000
app.minio.access-key=test
app.minio.secret-key=test
app.minio.bucket=test-bucket
app.minio.presign-expiry=10m